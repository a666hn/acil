name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Verify Cargo.toml version matches tag
        run: |
          VERSION="${VERSION#v}"
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "::error::Tag version does not match Cargo.toml"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --draft --verify-tag --title "$VERSION"

    outputs:
      version: ${{ env.VERSION }}

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: |
          dir="$RUNNER_TEMP/cross"
          mkdir "$dir"
          echo "$dir" >> $GITHUB_PATH
          curl -Lo "$dir/cross.tar.gz" \
            "https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz"
          tar -C "$dir" -xzf "$dir/cross.tar.gz"

      - name: Build
        run: |
          CARGO_BIN="cargo"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            CARGO_BIN="cross"
          fi
          $CARGO_BIN build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCHIVE="acil-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/acil" "$ARCHIVE/"
          cp README.md LICENSE* "$ARCHIVE/" 2>/dev/null || true
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          echo "ASSET=${ARCHIVE}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCHIVE="acil-${VERSION}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/acil.exe" "$ARCHIVE/"
          cp README.md LICENSE* "$ARCHIVE/" 2>/dev/null || true
          7z a "${ARCHIVE}.zip" "$ARCHIVE"
          echo "ASSET=${ARCHIVE}.zip" >> $GITHUB_ENV

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$VERSION" "$ASSET"

  publish-release:
    name: Publish Release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.version }}" --draft=false -R "${{ github.repository }}"
